<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login & Registration</title>
  <!-- Font Awesome for Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <!-- Form Header Tabs -->
    <div class="form-header">
      <button id="loginTabBtn" class="tab-btn active" onclick="switchTab('login')">
        <i class="fa-solid fa-right-to-bracket"></i> Login
      </button>
      <button id="registerTabBtn" class="tab-btn" onclick="switchTab('register')">
        <i class="fa-solid fa-user-plus"></i> Register
      </button>
    </div>

    <!-- Alert / Status Banner -->
    <div id="alertBox" class="alert hidden"></div>

    <!-- LOGIN FORM -->
    <form id="loginForm" class="form active" onsubmit="handleLogin(event)">
      <h2>Welcome Back</h2>
      <p class="subtitle">Enter your credentials to access your account</p>

      <div class="input-group">
        <label for="loginEmail">Email Address</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-envelope input-icon"></i>
          <input
            type="email"
            id="loginEmail"
            placeholder="name@example.com"
            required
          />
        </div>
      </div>

      <div class="input-group">
        <label for="loginPassword">Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock input-icon"></i>
          <input
            type="password"
            id="loginPassword"
            placeholder="••••••••"
            required
          />
          <i
            class="fa-regular fa-eye toggle-password"
            onclick="togglePasswordVisibility('loginPassword', this)"
          ></i>
        </div>
      </div>

      <div class="form-actions">
        <label class="checkbox-container">
          <input type="checkbox" id="rememberMe" />
          <span class="checkmark"></span>
          Remember me
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="submit-btn">
        <span>Sign In</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>

      <div class="divider"><span>OR</span></div>

      <div class="social-login">
        <button type="button" class="social-btn">
          <i class="fa-brands fa-google"></i>
        </button>
        <button type="button" class="social-btn">
          <i class="fa-brands fa-github"></i>
        </button>
      </div>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" class="form" onsubmit="handleRegister(event)">
      <h2>Create Account</h2>
      <p class="subtitle">Get started with your free account today</p>

      <div class="input-group">
        <label for="regName">Full Name</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-user input-icon"></i>
          <input
            type="text"
            id="regName"
            placeholder="John Doe"
            required
          />
        </div>
      </div>

      <div class="input-group">
        <label for="regEmail">Email Address</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-envelope input-icon"></i>
          <input
            type="email"
            id="regEmail"
            placeholder="name@example.com"
            required
          />
        </div>
      </div>

      <div class="input-group">
        <label for="regPassword">Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock input-icon"></i>
          <input
            type="password"
            id="regPassword"
            placeholder="At least 8 characters"
            oninput="checkPasswordStrength(this.value)"
            required
          />
          <i
            class="fa-regular fa-eye toggle-password"
            onclick="togglePasswordVisibility('regPassword', this)"
          ></i>
        </div>
        <!-- Password Strength Indicator -->
        <div class="strength-meter">
          <div id="strengthBar" class="strength-bar"></div>
        </div>
        <span id="strengthText" class="strength-text"></span>
      </div>

      <div class="input-group">
        <label for="regConfirmPassword">Confirm Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-shield-halved input-icon"></i>
          <input
            type="password"
            id="regConfirmPassword"
            placeholder="Repeat password"
            required
          />
        </div>
      </div>

      <div class="input-group">
        <label class="checkbox-container">
          <input type="checkbox" id="termsCheck" required />
          <span class="checkmark"></span>
          I agree to the <a href="#">Terms</a> & <a href="#">Privacy Policy</a>
        </label>
      </div>

      <button type="submit" class="submit-btn">
        <span>Create Account</span>
        <i class="fa-solid fa-user-plus"></i>
      </button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
